<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="B_77">
  <title>B_77 — Wortmarke · Richtung 1 „Der Grundsatz"</title>
  <desc>Die Wortmarke steht auf der roten Aktiv-Linie: der Unterstrich aus B_77 ist zur tragenden Grundlinie geworden. Die Lücke zwischen B und 77 hält die Position des Unterstrichs; die Linie endet rechts in einem kurzen Aufstrich — die aktive Korrekturmarke.</desc>

  <!-- Grotesk-Lockup (Ziel: Söhne Medium). Systemstack rendert überall offline. -->
  <text x="46" y="212"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="212" font-weight="500"
        letter-spacing="-3"
        fill="#1C1B18">B<tspan dx="52">77</tspan></text>

  <!-- DIE AKTIV-LINIE: der Unterstrich als tragende Grundlinie -->
  <!-- durchgezogener Grund, flush unter B-Stamm bis Rechtsterminal -->
  <rect x="44" y="212" width="418" height="22" fill="#CE2417"/>
  <!-- Rechtsterminal: die Linie steigt am rechten Ende auf = aktive Korrekturmarke -->
  <rect x="440" y="132" width="22" height="102" fill="#CE2417"/>
</svg>
