<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="B_77 — Icon / Monogramm. Das B auf der lebenden Mess-Achse.">
  <title>B_77 — Icon · Initial auf der lebenden Achse</title>
  <desc>Kompaktes Monogramm: das B von B_77 steht auf der vermessenen Grundlinie; roter Nullpunkt-Passer am Stamm, lebender Messwert in Signal-Lime steigt rechts nach oben.</desc>

  <!-- B — monogeometrisch -->
  <g fill="none" stroke="#1A1B1D" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter" shape-rendering="geometricPrecision">
    <path d="M62,54 L62,168"/>
    <path d="M62,54 L104,54 Q134,54 134,81 Q134,108 104,108 L62,108"/>
    <path d="M62,108 L106,108 Q138,108 138,138 Q138,168 104,168 L62,168"/>
  </g>

  <!-- Mess-Achse (der Unterstrich) -->
  <line x1="44" y1="188" x2="196" y2="188" stroke="#1A1B1D" stroke-width="3"/>
  <g stroke="#5E6063" stroke-width="1.5">
    <line x1="88"  y1="188" x2="88"  y2="196"/>
    <line x1="116" y1="188" x2="116" y2="196"/>
    <line x1="144" y1="188" x2="144" y2="196"/>
  </g>

  <!-- Nullpunkt Register-Rot am B-Stamm -->
  <g stroke="#E5261F" stroke-width="2">
    <line x1="62" y1="174" x2="62" y2="202"/>
    <line x1="48" y1="188" x2="76" y2="188"/>
  </g>

  <!-- Lebender Messwert -->
  <line x1="178" y1="188" x2="178" y2="128" stroke="#DCF500" stroke-width="10"/>
  <rect x="167" y="108" width="22" height="22" fill="#DCF500"/>
</svg>
