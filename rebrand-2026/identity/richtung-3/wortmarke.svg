<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="540" height="210" role="img" aria-label="B_77 — Wortmarke. Der Unterstrich ist die Mess-Achse mit Tick-Marken; der lebende Wert steigt in Signal-Lime.">
  <title>B_77 — Richtung 3 · Die Vertriebsintelligenz</title>
  <desc>Wortmarke B_77. Buchstaben in Graphit, monogeometrisch konstruiert. Der Unterstrich wird zur vermessenen Grundlinie mit Tick-Marken; roter Passer am Nullpunkt, lebender Messwert in Signal-Lime steigt von der Achse nach oben.</desc>

  <!-- ==== BUCHSTABEN — Graphit, monogeometrisch, butt caps ============= -->
  <g fill="none" stroke="#1A1B1D" stroke-width="20" stroke-linecap="butt" stroke-linejoin="miter" shape-rendering="geometricPrecision">
    <!-- B -->
    <path d="M40,30 L40,150"/>
    <path d="M40,30 L86,30 Q118,30 118,60 Q118,90 86,90 L40,90"/>
    <path d="M40,90 L88,90 Q122,90 122,120 Q122,150 86,150 L40,150"/>
    <!-- 7 -->
    <path d="M210,30 L300,30 L250,150"/>
    <!-- 7 -->
    <path d="M330,30 L420,30 L370,150"/>
  </g>

  <!-- ==== DER UNTERSTRICH = MESS-ACHSE ================================= -->
  <!-- Grundlinie -->
  <line x1="40" y1="176" x2="460" y2="176" stroke="#1A1B1D" stroke-width="2"/>

  <!-- Minor-Ticks (systematische Hairline) -->
  <g stroke="#5E6063" stroke-width="1">
    <line x1="68"  y1="176" x2="68"  y2="183"/>
    <line x1="96"  y1="176" x2="96"  y2="183"/>
    <line x1="124" y1="176" x2="124" y2="183"/>
    <line x1="152" y1="176" x2="152" y2="183"/>
    <line x1="208" y1="176" x2="208" y2="183"/>
    <line x1="236" y1="176" x2="236" y2="183"/>
    <line x1="264" y1="176" x2="264" y2="183"/>
    <line x1="292" y1="176" x2="292" y2="183"/>
    <line x1="348" y1="176" x2="348" y2="183"/>
    <line x1="376" y1="176" x2="376" y2="183"/>
    <line x1="404" y1="176" x2="404" y2="183"/>
    <line x1="432" y1="176" x2="432" y2="183"/>
  </g>
  <!-- Major-Ticks (jeder 5.) -->
  <g stroke="#1A1B1D" stroke-width="1">
    <line x1="180" y1="176" x2="180" y2="189"/>
    <line x1="320" y1="176" x2="320" y2="189"/>
  </g>

  <!-- Nullpunkt — Passermarke in Register-Rot (Achse beginnt am B-Stamm) -->
  <g stroke="#E5261F" stroke-width="1.5">
    <line x1="40" y1="164" x2="40" y2="192"/>
    <line x1="28" y1="176" x2="52" y2="176"/>
  </g>

  <!-- Lebender Messwert — Signal-Lime steigt von der Achse nach oben ==== -->
  <line x1="460" y1="176" x2="460" y2="100" stroke="#DCF500" stroke-width="8"/>
  <rect x="450" y="80" width="20" height="20" fill="#DCF500"/>
</svg>
