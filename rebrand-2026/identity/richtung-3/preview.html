<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B_77 · Richtung 3 — Marken-Preview</title>
<style>
  body{margin:0;font-family:ui-monospace,Menlo,monospace}
  .row{display:grid;grid-template-columns:1fr 1fr}
  .cell{padding:56px;display:flex;flex-direction:column;align-items:center;gap:28px;min-height:100vh;justify-content:center}
  .on-white{background:#EDEDEA}.on-black{background:#1A1B1D}
  .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .on-white .cap{color:#5E6063}.on-black .cap{color:#9A9C9F}
  img.wm{width:min(420px,80%)}img.ic{width:120px}
  @media(max-width:720px){.row{grid-template-columns:1fr}.cell{min-height:auto}}
</style></head>
<body>
<div class="row">
  <div class="cell on-white">
    <span class="cap">Wortmarke · technisches Weiß</span>
    <img class="wm" src="wortmarke.svg" alt="B_77 Wortmarke">
    <img class="ic" src="icon.svg" alt="B_77 Icon">
    <span class="cap">Icon / Monogramm</span>
  </div>
  <div class="cell on-black">
    <span class="cap">Wortmarke · invers / Leitstand</span>
    <img class="wm" src="wortmarke-invers.svg" alt="B_77 Wortmarke invers">
    <span class="cap" style="color:#DCF500">Lebender Wert = Signal-Lime</span>
  </div>
</div>
</body></html>
